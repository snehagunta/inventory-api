name: golangci-lint
on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
permissions:
  contents: read
jobs:
  golangci-lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        run: go -C tools/golangci-lint build -o /tmp/inventory-api-golangci-lint .
      - name: Run linters
        run: /tmp/inventory-api-golangci-lint run --config .golangci.yaml --timeout=10m ./...
