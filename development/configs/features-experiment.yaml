server:
  http:
    address: 0.0.0.0:8081
  grpc:
    address: 0.0.0.0:9081
authn:
  authenticator:
    type: first_match
    chain:
      - type: allow-unauthenticated
        transport:
          http: true
          grpc: true
authz:
  impl: kessel
  kessel:
    insecure-client: true
    url: localhost:9000
    enable-oidc-auth: false
eventing:
  eventer: stdout
storage:
  max-serialization-retries: 10
  outbox-mode: wal
  database: postgres
  postgres:
    host: "localhost"
    port: "5433"
    user: "postgres"
    password: "yPsw5e6ab4bvAGe5H"
    dbname: "spicedb"
schema:
  repository: in-memory
  in-memory:
    type: json
    path: schema_cache.json
consumer:
  enabled: true
  bootstrap-servers: localhost:9092
  retry-options:
    consumer-max-retries: 3
    operation-max-retries: 4
    backoff-factor: 5
  auth:
    enabled: false
log:
  level: "debug"
  livez: true
  readyz: true
